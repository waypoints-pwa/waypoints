name: Server image

on:
  push:
    branches: [main]
    paths: [server/**, src/domain/**, src/db/types.ts, .dockerignore, .github/workflows/server-image.yml]
  pull_request:
    paths: [server/**, src/domain/**, src/db/types.ts, .dockerignore, .github/workflows/server-image.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/waypoints-server

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Their helper images come from Google's mirror of Docker Hub, as does the Dockerfile's base
      # image: runners share IP addresses, which often hit Docker Hub's anonymous pull limit.
      - uses: docker/setup-qemu-action@v4
        with:
          image: mirror.gcr.io/tonistiigi/binfmt:latest
      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1

      # Smoke test: the image starts, generates its server code and answers health checks.
      - name: Build for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Dockerfile
          load: true
          tags: waypoints-server:test
      - name: Smoke test
        run: |
          docker run -d --name ws -p 8788:8788 waypoints-server:test
          for i in $(seq 1 20); do curl -fs localhost:8788/api/health && break; sleep 1; done
          curl -fs localhost:8788/api/health
          curl -fs localhost:8788/api/server | grep -q '"app":"waypoints-server"'
          docker logs ws | grep -q "Server code"
          docker rm -f ws

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
